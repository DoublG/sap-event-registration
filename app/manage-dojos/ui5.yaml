# UI5 tooling: cds-plugin-ui5 serves this app inside `cds watch` and runs
# ui5-tooling-transpile, which compiles webapp/*.ts to UI5 modules on the fly
# (and in `ui5 build`). UI5 itself comes from ui5.sap.com (webapp/index.html).
specVersion: "4.0"
metadata:
  name: coderdojo.managedojos
type: application
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
customConfiguration:
  cds-plugin-ui5:
    mountPath: /manage-dojos
