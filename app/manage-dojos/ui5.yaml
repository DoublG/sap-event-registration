specVersion: "4.0"
metadata:
  name: coderdojo.managedojos
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        backend:
          - path: /manage
            url: http://localhost:4004
        ui5:
          path: [/resources, /test-resources]
          url: https://ui5.sap.com
          version: 1.148.12
